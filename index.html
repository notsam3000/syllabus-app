<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Syllabus Ledger</title>
<meta name="theme-color" content="#45569E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Syllabus">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --md-primary: #45569E;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #DEE1FF;
    --md-on-primary-container: #030A4D;

    --md-secondary: #2E7D5B;
    --md-secondary-container: #C6EFD1;
    --md-on-secondary-container: #052E10;

    --md-error: #BA1A1A;
    --md-error-container: #FFDAD6;
    --md-on-error-container: #410002;

    --md-surface: #FCFAFF;
    --md-surface-container-low: #F6F3FC;
    --md-surface-container: #F1EEF9;
    --md-surface-container-high: #EBE7F4;
    --md-surface-variant: #E3E1EC;
    --md-on-surface: #1B1B21;
    --md-on-surface-variant: #46464F;
    --md-outline: #767680;
    --md-outline-variant: #C6C5D0;

    --r-xs: 8px;
    --r-sm: 12px;
    --r-md: 16px;
    --r-lg: 24px;
    --r-full: 999px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--md-surface);
    color:var(--md-on-surface);
    font-family:"Roboto Flex","Roboto",system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  .hidden{ display:none !important; }

  .appbar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--md-surface);
    padding:calc(16px + env(safe-area-inset-top)) 20px 14px 20px;
    border-bottom:1px solid var(--md-surface-container-high);
  }
  .appbar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .appbar-titles{ min-width:0; }
  .appbar-eyebrow{
    font-size:12px;
    color:var(--md-on-surface-variant);
    margin:0 0 2px 0;
    font-weight:500;
  }
  .appbar h1{
    margin:0;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.2px;
  }
  .pct-chip{
    flex:none;
    background:var(--md-primary-container);
    color:var(--md-on-primary-container);
    font-size:15px;
    font-weight:700;
    padding:8px 16px;
    border-radius:var(--r-full);
    white-space:nowrap;
  }

  .content{
    max-width:640px;
    margin:0 auto;
    padding:16px 16px 24px 16px;
  }

  .card-tonal{
    background:var(--md-primary-container);
    color:var(--md-on-primary-container);
    border-radius:var(--r-lg);
    padding:20px 22px;
    margin-bottom:16px;
  }
  .card-top{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:14px;
  }
  .card-top .num{ font-size:36px; font-weight:700; line-height:1; }
  .card-top .lbl{ font-size:14px; opacity:0.85; }
  .track{
    height:8px;
    background:rgba(255,255,255,0.45);
    border-radius:var(--r-full);
    overflow:hidden;
    margin-bottom:16px;
  }
  .track-fill{
    height:100%;
    background:var(--md-primary);
    border-radius:var(--r-full);
    transition:width 0.25s ease;
  }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip{
    font-size:12.5px;
    font-weight:500;
    padding:7px 12px;
    border-radius:var(--r-full);
    border:1px solid rgba(3,10,77,0.25);
    background:rgba(255,255,255,0.35);
  }
  .chip b{ font-weight:700; }

  .subject-card{
    background:var(--md-surface-container-low);
    border-radius:var(--r-md);
    margin-bottom:12px;
    overflow:hidden;
  }
  .subject-head{
    display:flex; align-items:center; gap:12px;
    padding:16px 18px;
    cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  .subject-head:active{ background:var(--md-surface-container); }
  .expand-icon{
    flex:none; width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    color:var(--md-on-surface-variant);
    transition:transform 0.2s ease;
  }
  .subject-card.open .expand-icon{ transform:rotate(180deg); }
  .subject-main{ flex:1; min-width:0; }
  .subject-name{ font-size:16px; font-weight:600; margin:0 0 8px 0; }
  .subject-track{
    height:6px; background:var(--md-surface-variant);
    border-radius:var(--r-full); overflow:hidden;
  }
  .subject-track-fill{
    height:100%; background:var(--md-primary);
    border-radius:var(--r-full); transition:width 0.2s ease;
  }
  .subject-frac{
    flex:none; font-size:13px; font-weight:600;
    color:var(--md-on-surface-variant);
    background:var(--md-surface-container-high);
    padding:5px 10px; border-radius:var(--r-full);
  }
  .subject-body{ display:none; padding:0 14px 16px 14px; }
  .subject-card.open .subject-body{ display:block; }

  .chapter-row{
    display:flex; align-items:center; gap:12px;
    padding:10px 8px; border-radius:var(--r-sm);
  }
  .chapter-row:active{ background:var(--md-surface-container); }

  .m3-check{
    flex:none; width:20px; height:20px; border-radius:4px;
    border:2px solid var(--md-outline); background:transparent;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .m3-check.done{ background:var(--md-primary); border-color:var(--md-primary); }
  .m3-check svg{ width:14px; height:14px; display:none; }
  .m3-check.done svg{ display:block; }

  .chapter-name{ flex:1; font-size:15px; line-height:1.35; min-width:0; word-break:break-word; }
  .chapter-name.done{ color:var(--md-on-surface-variant); text-decoration:line-through; }

  .icon-btn{
    flex:none; width:36px; height:36px; border-radius:var(--r-full);
    border:none; background:transparent; color:var(--md-on-surface-variant);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:active{ background:var(--md-surface-container-high); color:var(--md-error); }
  .icon-btn svg{ width:18px; height:18px; }

  .empty-note{
    font-size:13.5px; color:var(--md-on-surface-variant);
    padding:10px 8px 4px 8px; line-height:1.4;
  }

  .field-row{ display:flex; gap:8px; margin-top:10px; padding:0 2px; }
  .m3-field, select.m3-field{
    flex:1; font-family:inherit; font-size:14.5px;
    padding:12px 14px; border-radius:var(--r-sm);
    border:1.5px solid var(--md-outline-variant);
    background:var(--md-surface); color:var(--md-on-surface);
  }
  .m3-field:focus{ outline:none; border-color:var(--md-primary); box-shadow:0 0 0 1px var(--md-primary); }
  .btn-filled{
    flex:none; font-family:inherit; font-size:14px; font-weight:600;
    padding:0 20px; height:44px; border-radius:var(--r-full); border:none;
    background:var(--md-primary); color:var(--md-on-primary); cursor:pointer;
  }
  .btn-filled:active{ opacity:0.85; }
  .btn-filled.wide{ width:100%; }
  .btn-filled.error{ background:var(--md-error); }
  .btn-tonal{
    flex:none; font-family:inherit; font-size:14px; font-weight:600;
    padding:0 20px; height:44px; border-radius:var(--r-full); border:none;
    background:var(--md-surface-container-high); color:var(--md-on-surface); cursor:pointer;
  }
  .btn-tonal:active{ background:var(--md-outline-variant); }
  .btn-text{
    font-family:inherit; font-size:13.5px; font-weight:600;
    background:none; border:none; color:var(--md-primary); cursor:pointer; padding:10px 6px;
  }

  .bulk-area{ display:none; padding:0 2px; }
  .bulk-area.open{ display:block; }
  .bulk-area textarea{
    width:100%; min-height:84px; font-family:inherit; font-size:14px;
    padding:12px 14px; border-radius:var(--r-sm);
    border:1.5px solid var(--md-outline-variant); background:var(--md-surface);
    resize:vertical; margin-bottom:8px;
  }
  .bulk-area textarea:focus{ outline:none; border-color:var(--md-primary); }

  footer{
    max-width:640px; margin:8px auto 0 auto; padding:8px 20px 0 20px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color:var(--md-on-surface-variant);
  }
  .save-note{ opacity:0; transition:opacity 0.3s ease; }
  .save-note.show{ opacity:1; }
  .reset-link{ background:none; border:none; color:var(--md-error); font-size:12.5px; font-weight:500; cursor:pointer; padding:0; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:20;
    display:flex;
    gap:4px;
    background:var(--md-surface-container-high);
    border-radius:var(--r-full);
    padding:6px;
    box-shadow:0 4px 16px rgba(27,27,33,0.18);
  }
  .nav-item{
    display:flex; align-items:center; gap:8px;
    border:none; background:transparent; cursor:pointer;
    padding:10px 18px; border-radius:var(--r-full);
    color:var(--md-on-surface-variant);
    font-family:inherit; font-size:13.5px; font-weight:600;
  }
  .nav-item svg{ width:20px; height:20px; }
  .nav-item.active{ background:var(--md-primary-container); color:var(--md-on-primary-container); }

  /* ---------- Focus page ---------- */
  .segmented{
    display:flex; background:var(--md-surface-container-high);
    border-radius:var(--r-full); padding:4px; margin-bottom:16px;
  }
  .segment-btn{
    flex:1; border:none; background:transparent; cursor:pointer;
    padding:10px 0; border-radius:var(--r-full);
    font-family:inherit; font-size:13.5px; font-weight:600;
    color:var(--md-on-surface-variant);
  }
  .segment-btn.active{ background:var(--md-primary); color:var(--md-on-primary); }
  .segment-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .timer-card{
    background:var(--md-surface-container-low);
    border-radius:var(--r-lg);
    padding:26px 22px;
    text-align:center;
    margin-bottom:16px;
  }
  .timer-phase{
    font-size:13px; font-weight:600; letter-spacing:0.2px;
    color:var(--md-on-surface-variant); margin-bottom:10px;
  }
  .timer-clock{
    font-size:56px; font-weight:700; font-variant-numeric:tabular-nums;
    letter-spacing:1px; margin-bottom:6px;
  }
  .timer-sub{ font-size:13px; color:var(--md-on-surface-variant); margin-bottom:18px; min-height:18px; }
  .timer-setup{ text-align:left; margin-bottom:16px; }
  .timer-setup label{
    display:block; font-size:12.5px; font-weight:600;
    color:var(--md-on-surface-variant); margin:0 2px 6px 2px;
  }
  .timer-setup .m3-field{ width:100%; margin-bottom:10px; }
  .timer-actions{ display:flex; gap:10px; }
  .timer-actions button{ flex:1; }

  .stats-card{ background:var(--md-secondary-container); color:var(--md-on-secondary-container); border-radius:var(--r-lg); padding:20px 22px; margin-bottom:16px; }
  .stats-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .stats-head h3{ margin:0; font-size:15px; font-weight:700; }
  .gear-btn{
    width:32px; height:32px; border-radius:var(--r-full); border:none;
    background:rgba(5,46,16,0.08); color:var(--md-on-secondary-container);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .gear-btn svg{ width:16px; height:16px; }
  .stats-track{ height:8px; background:rgba(5,46,16,0.15); border-radius:var(--r-full); overflow:hidden; margin-top:12px; }
  .stats-track-fill{ height:100%; background:var(--md-secondary); border-radius:var(--r-full); transition:width 0.25s ease; }

  /* ---------- Overlays / dialogs ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(27,27,33,0.4);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50; opacity:0; pointer-events:none;
    transition:opacity 0.15s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .dialog-card{
    background:var(--md-surface-container-low);
    border-radius:var(--r-lg);
    padding:22px 22px 16px 22px;
    width:100%; max-width:380px;
  }
  .dialog-card h3{ margin:0 0 10px 0; font-size:18px; font-weight:700; }
  .dialog-card p{ margin:0 0 20px 0; font-size:14.5px; line-height:1.45; color:var(--md-on-surface-variant); }
  .dialog-actions{ display:flex; justify-content:flex-end; gap:6px; }

  .settings-field{ margin-bottom:14px; }
  .settings-field label{ display:block; font-size:12.5px; font-weight:600; color:var(--md-on-surface-variant); margin-bottom:6px; }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(27,27,33,0.4);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; opacity:0; pointer-events:none; transition:opacity 0.15s ease;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet-card{
    background:var(--md-surface);
    border-radius:var(--r-lg) var(--r-lg) 0 0;
    width:100%; max-width:640px;
    max-height:78vh;
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 12px 20px; border-bottom:1px solid var(--md-surface-container-high);
  }
  .sheet-head h3{ margin:0; font-size:17px; font-weight:700; }
  .sheet-body{ overflow-y:auto; padding:8px 12px 20px 12px; }
  .session-row{
    display:flex; align-items:center; gap:10px;
    padding:12px 10px; border-radius:var(--r-sm);
  }
  .session-row:active{ background:var(--md-surface-container); }
  .session-main{ flex:1; min-width:0; }
  .session-label{ font-size:14.5px; font-weight:600; margin:0 0 2px 0; word-break:break-word; }
  .session-meta{ font-size:12.5px; color:var(--md-on-surface-variant); }
  .session-dur{
    flex:none; font-size:12.5px; font-weight:700;
    background:var(--md-surface-container-high); padding:5px 10px; border-radius:var(--r-full);
  }
  .day-heading{
    font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--md-on-surface-variant); padding:14px 10px 6px 10px;
  }

  @media (max-width:420px){
    .appbar{ padding:calc(14px + env(safe-area-inset-top)) 16px 12px 16px; }
    .appbar h1{ font-size:20px; }
    .card-top .num{ font-size:32px; }
    .timer-clock{ font-size:46px; }
  }
</style>
</head>
<body>
<div class="appbar">
  <div class="appbar-row">
    <div class="appbar-titles">
      <p class="appbar-eyebrow" id="appbarEyebrow">Class 12 · Commerce</p>
      <h1 id="appbarTitle">Syllabus Ledger</h1>
    </div>
    <div class="pct-chip" id="pctChip">0%</div>
  </div>
</div>

<!-- HOME PAGE -->
<div class="content" id="page-home">
  <div class="card-tonal">
    <div class="card-top">
      <span class="num" id="totalPct">0%</span>
      <span class="lbl" id="totalSub">0 of 0 topics done</span>
    </div>
    <div class="track"><div class="track-fill" id="overviewTrackFill" style="width:0%"></div></div>
    <div class="chip-row" id="milestones"></div>
  </div>

  <div id="subjects"></div>
</div>

<!-- FOCUS PAGE -->
<div class="content hidden" id="page-focus">
  <div class="segmented">
    <button class="segment-btn active" id="segPomodoro">Pomodoro</button>
    <button class="segment-btn" id="segStopwatch">Stopwatch</button>
  </div>

  <div class="timer-card">
    <div class="timer-phase" id="timerPhase">Ready to focus</div>
    <div class="timer-clock" id="timerClock">25:00</div>
    <div class="timer-sub" id="timerSub"></div>

    <div class="timer-setup" id="timerSetup">
      <label for="focusLabelInput">What are you focusing on?</label>
      <input class="m3-field" id="focusLabelInput" type="text" placeholder="e.g. Accounts — Partnership chapter">
      <label for="focusSubjectSelect">Subject (optional)</label>
      <select class="m3-field" id="focusSubjectSelect"></select>
    </div>

    <div class="timer-actions" id="timerActions"></div>
  </div>

  <div class="stats-card">
    <div class="stats-head">
      <h3>Today's focus</h3>
      <button class="gear-btn" id="focusSettingsBtn" aria-label="edit goal">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V19a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H4a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H10a1.6 1.6 0 001-1.5V4a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V10a1.6 1.6 0 001.5 1H20a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div id="statsSummary" style="font-size:14px;">0m of 4h 0m</div>
    <div class="stats-track"><div class="stats-track-fill" id="statsTrackFill" style="width:0%"></div></div>
  </div>

  <button class="btn-tonal wide" style="width:100%;" id="historyBtn">View session history</button>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="home" id="navHome">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h11M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Home
  </button>
  <button class="nav-item" data-page="focus" id="navFocus">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Focus
  </button>
</nav>

<footer>
  <span id="saveNote" class="save-note">saved</span>
  <button class="reset-link" id="resetBtn">reset all data</button>
</footer>

<!-- Confirm dialog -->
<div class="overlay" id="confirmOverlay">
  <div class="dialog-card">
    <h3 id="confirmTitle">Delete this?</h3>
    <p id="confirmMessage">This can't be undone.</p>
    <div class="dialog-actions">
      <button class="btn-text" id="confirmCancelBtn">Cancel</button>
      <button class="btn-filled error" id="confirmOkBtn">Delete</button>
    </div>
  </div>
</div>

<!-- Focus settings dialog -->
<div class="overlay" id="settingsOverlay">
  <div class="dialog-card">
    <h3>Focus settings</h3>
    <div class="settings-field">
      <label for="goalHoursInput">Daily focus goal (hours)</label>
      <input class="m3-field" style="width:100%;" id="goalHoursInput" type="number" min="0.5" step="0.5">
    </div>
    <div class="settings-field">
      <label for="pomoMinInput">Pomodoro length (minutes)</label>
      <input class="m3-field" style="width:100%;" id="pomoMinInput" type="number" min="1" step="1">
    </div>
    <div class="settings-field">
      <label for="breakMinInput">Break length (minutes)</label>
      <input class="m3-field" style="width:100%;" id="breakMinInput" type="number" min="1" step="1">
    </div>
    <div class="dialog-actions">
      <button class="btn-text" id="settingsCancelBtn">Cancel</button>
      <button class="btn-filled" id="settingsSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- History sheet -->
<div class="sheet-overlay" id="historyOverlay">
  <div class="sheet-card">
    <div class="sheet-head">
      <h3>Session history</h3>
      <button class="icon-btn" id="historyCloseBtn" aria-label="close">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="historyBody"></div>
  </div>
</div>

<script>

const DEFAULT_SUBJECTS = [
  'Commerce','Economics','Accounts','Computer Science',
  'English (Language and Literature)','Physical Education'
];

let state = null;
let openSubjectId = null;
let currentPage = 'home';

function uid(){ return Math.random().toString(36).slice(2,10); }

function makeDefaultState(){
  return {
    subjects: DEFAULT_SUBJECTS.map(name => ({ id: uid(), name, chapters: [] })),
    focus: {
      settings: { dailyGoalMinutes: 240, pomodoroMinutes: 25, breakMinutes: 10 },
      sessions: []
    }
  };
}

async function loadState(){
  try{
    const { data, error } = await supabaseClient
      .from('syllabus_data')
      .select('payload')
      .eq('id', ROW_ID)
      .maybeSingle();
    if(error) throw error;
    if(data && data.payload && data.payload.subjects){
      state = data.payload;
      if(!state.focus){
        state.focus = { settings: { dailyGoalMinutes: 240, pomodoroMinutes: 25, breakMinutes: 10 }, sessions: [] };
      }
      return;
    }
  }catch(e){
    console.error('load failed', e);
  }
  state = makeDefaultState();
}

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      const { error } = await supabaseClient
        .from('syllabus_data')
        .upsert({ id: ROW_ID, payload: state, updated_at: new Date().toISOString() });
      if(error) throw error;
      flashSaved('saved');
    }catch(e){
      console.error('save failed', e);
      flashSaved('save failed — check your Supabase keys');
    }
  }, 250);
}

function flashSaved(msg){
  const el = document.getElementById('saveNote');
  el.textContent = msg;
  el.classList.add('show');

}

/* ---------------- Confirm dialog ---------------- */
function openConfirmDialog(title, message, onConfirm){
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMessage').textContent = message;
  const overlay = document.getElementById('confirmOverlay');
  overlay.classList.add('open');
  const okBtn = document.getElementById('confirmOkBtn');
  const cancelBtn = document.getElementById('confirmCancelBtn');
  const cleanup = () => {
    overlay.classList.remove('open');
    okBtn.onclick = null; cancelBtn.onclick = null; overlay.onclick = null;
  };
  okBtn.onclick = () => { cleanup(); onConfirm(); };
  cancelBtn.onclick = cleanup;
  overlay.onclick = (e) => { if(e.target === overlay) cleanup(); };
}

/* ---------------- Milestones / totals ---------------- */
function weeksUntil(dateStr){
  const target = new Date(dateStr);
  const now = new Date();
  const diffMs = target - now;
  if(diffMs <= 0) return null;
  return Math.round(diffMs / (1000*60*60*24*7));
}

function renderMilestones(){
  const wrap = document.getElementById('milestones');
  const items = [
    { label: 'Preboards', date: '2026-11-01' },
    { label: 'Boards', date: '2027-02-01' }
  ];
  wrap.innerHTML = items.map(m => {
    const w = weeksUntil(m.date);
    const wt = w === null ? 'underway' : `${w} weeks`;
    return `<span class="chip">${m.label} <b>${wt}</b></span>`;
  }).join('');
}

function subjectStats(subject){
  const total = subject.chapters.length;
  const done = subject.chapters.filter(c => c.done).length;
  const pct = total === 0 ? 0 : Math.round((done/total)*100);
  return { total, done, pct };
}

const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.5L9.5 18L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const TRASH_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEVRON_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function renderTotals(){
  let total = 0, done = 0;
  state.subjects.forEach(s => {
    total += s.chapters.length;
    done += s.chapters.filter(c => c.done).length;
  });
  const pct = total === 0 ? 0 : Math.round((done/total)*100);
  document.getElementById('totalPct').textContent = pct + '%';
  document.getElementById('totalSub').textContent = `${done} of ${total} topics done`;
  document.getElementById('overviewTrackFill').style.width = pct + '%';
  if(currentPage === 'home') document.getElementById('pctChip').textContent = pct + '%';
}

/* ---------------- Home page render ---------------- */
function renderSubjects(){
  const container = document.getElementById('subjects');
  container.innerHTML = '';

  state.subjects.forEach(subject => {
    const { total, done, pct } = subjectStats(subject);
    const isOpen = subject.id === openSubjectId;

    const card = document.createElement('div');
    card.className = 'subject-card' + (isOpen ? ' open' : '');
    card.dataset.id = subject.id;

    const head = document.createElement('div');
    head.className = 'subject-head';
    head.innerHTML = `
      <div class="subject-main">
        <p class="subject-name">${escapeHtml(subject.name)}</p>
        <div class="subject-track"><div class="subject-track-fill" style="width:${pct}%"></div></div>
      </div>
      <span class="subject-frac">${done}/${total}</span>
      <span class="expand-icon">${CHEVRON_SVG}</span>
    `;
    head.addEventListener('click', () => {
      openSubjectId = isOpen ? null : subject.id;
      renderSubjects();
    });
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'subject-body';

    if(subject.chapters.length === 0){
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = 'No chapters added yet — add them below, or paste your whole syllabus at once.';
      body.appendChild(note);
    }

    subject.chapters.forEach(ch => {
      const row = document.createElement('div');
      row.className = 'chapter-row';
      row.innerHTML = `
        <button class="m3-check ${ch.done ? 'done' : ''}" aria-label="toggle done">${CHECK_SVG}</button>
        <span class="chapter-name ${ch.done ? 'done' : ''}">${escapeHtml(ch.name)}</span>
        <button class="icon-btn" aria-label="delete">${TRASH_SVG}</button>
      `;
      row.querySelector('.m3-check').addEventListener('click', () => {
        ch.done = !ch.done;
        renderSubjects();
        renderTotals();
        scheduleSave();
      });
      row.querySelector('.icon-btn').addEventListener('click', () => {
        openConfirmDialog(
          'Delete chapter?',
          `"${ch.name}" will be removed from ${subject.name}. This can't be undone.`,
          () => {
            subject.chapters = subject.chapters.filter(c => c.id !== ch.id);
            renderSubjects();
            renderTotals();
            scheduleSave();
          }
        );
      });
      body.appendChild(row);
    });

    const fieldRow = document.createElement('div');
    fieldRow.className = 'field-row';
    fieldRow.innerHTML = `
      <input class="m3-field" type="text" placeholder="Add a chapter or topic" />
      <button class="btn-filled">Add</button>
    `;
    const input = fieldRow.querySelector('input');
    const addChapter = () => {
      const val = input.value.trim();
      if(!val) return;
      subject.chapters.push({ id: uid(), name: val, done: false });
      input.value = '';
      renderSubjects();
      renderTotals();
      scheduleSave();
    };
    fieldRow.querySelector('button').addEventListener('click', addChapter);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') addChapter(); });
    body.appendChild(fieldRow);

    const bulkToggle = document.createElement('button');
    bulkToggle.className = 'btn-text';
    bulkToggle.textContent = 'paste multiple chapters at once';
    const bulkArea = document.createElement('div');
    bulkArea.className = 'bulk-area';
    bulkArea.innerHTML = `
      <textarea placeholder="Paste chapter names, one per line"></textarea>
      <button class="btn-filled">Add all</button>
    `;
    bulkToggle.addEventListener('click', () => bulkArea.classList.toggle('open'));
    bulkArea.querySelector('button').addEventListener('click', () => {
      const ta = bulkArea.querySelector('textarea');
      const lines = ta.value.split('\n').map(l => l.trim()).filter(Boolean);
      lines.forEach(name => subject.chapters.push({ id: uid(), name, done: false }));
      ta.value = '';
      bulkArea.classList.remove('open');
      renderSubjects();
      renderTotals();
      scheduleSave();
    });
    body.appendChild(bulkToggle);
    body.appendChild(bulkArea);

    card.appendChild(body);
    container.appendChild(card);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

    () => {
      state = makeDefaultState();
      openSubjectId = null;
      renderSubjects();
      renderTotals();
      renderFocusPage();
      scheduleSave();
    }
  );
});

/* ==================== FOCUS PAGE ==================== */
let timer = {
  mode: 'pomodoro',       // 'pomodoro' | 'stopwatch'
  phase: 'idle',          // idle | running | paused | break | breakPaused
  elapsed: 0,
  label: '',
  subjectId: '',
  intervalId: null
};

function getFocusSettings(){ return state.focus.settings; }

function fmtClock(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s/60);
  const sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function fmtDuration(totalSeconds){
  const s = Math.round(totalSeconds);
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  if(h > 0) return `${h}h ${m}m`;
  if(m > 0) return `${m}m`;
  return `${s}s`;
}

function populateSubjectSelect(){
  const sel = document.getElementById('focusSubjectSelect');
  const prev = sel.value;
  sel.innerHTML = '<option value="">No subject</option>' +
    state.subjects.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  if(prev) sel.value = prev;
}

function setMode(mode){
  if(timer.phase !== 'idle') return; // don't allow mode switch mid-session
  timer.mode = mode;
  document.getElementById('segPomodoro').classList.toggle('active', mode==='pomodoro');
  document.getElementById('segStopwatch').classList.toggle('active', mode==='stopwatch');
  updateTimerDisplay();
}

function saveSession(durationSeconds){
  if(durationSeconds < 5) return;
  const label = timer.label.trim() || 'Focus session';
  const subject = state.subjects.find(s => s.id === timer.subjectId);
  state.focus.sessions.unshift({
    id: uid(),
    label,
    subjectId: timer.subjectId || null,
    subjectName: subject ? subject.name : null,
    mode: timer.mode,
    durationSeconds: Math.round(durationSeconds),
    startedAt: new Date(Date.now() - durationSeconds*1000).toISOString(),
    endedAt: new Date().toISOString()
  });
  scheduleSave();
}

function startSession(){
  const input = document.getElementById('focusLabelInput');
  const sel = document.getElementById('focusSubjectSelect');
  timer.label = input.value;
  timer.subjectId = sel.value;
  timer.elapsed = 0;
  timer.phase = 'running';
  clearInterval(timer.intervalId);
  timer.intervalId = setInterval(tick, 1000);
  renderFocusPage();
}

function pauseSession(){
  clearInterval(timer.intervalId);
  timer.phase = timer.phase === 'break' ? 'breakPaused' : 'paused';
  renderFocusPage();
}

function resumeSession(){
  timer.phase = timer.phase === 'breakPaused' ? 'break' : 'running';
  timer.intervalId = setInterval(tick, 1000);
  renderFocusPage();
}

function stopSession(){
  clearInterval(timer.intervalId);
  const wasFocusPhase = timer.phase === 'running' || timer.phase === 'paused';
  if(wasFocusPhase && timer.elapsed >= 5){
    saveSession(timer.elapsed);
  }
  timer.phase = 'idle';
  timer.elapsed = 0;
  renderFocusPage();
  renderStats();
}

function tick(){
  timer.elapsed++;
  const settings = getFocusSettings();
  if(timer.mode === 'pomodoro'){
    if(timer.phase === 'running'){
      const target = settings.pomodoroMinutes * 60;
      if(timer.elapsed >= target){
        saveSession(target);
        timer.elapsed = 0;
        timer.phase = 'break';
        renderStats();
        renderFocusPage();
        return;
      }
    } else if(timer.phase === 'break'){
      const target = settings.breakMinutes * 60;
      if(timer.elapsed >= target){
        clearInterval(timer.intervalId);
        timer.phase = 'idle';
        timer.elapsed = 0;
        renderFocusPage();
        return;
      }
    }
  }
  updateTimerDisplay();
}

function updateTimerDisplay(){
  const settings = getFocusSettings();
  const clockEl = document.getElementById('timerClock');
  const phaseEl = document.getElementById('timerPhase');
  const subEl = document.getElementById('timerSub');

  if(timer.mode === 'stopwatch'){
    clockEl.textContent = fmtClock(timer.elapsed);
  } else {
    const target = timer.phase === 'break' || timer.phase === 'breakPaused'
      ? settings.breakMinutes*60 : settings.pomodoroMinutes*60;
    clockEl.textContent = fmtClock(Math.max(0, target - timer.elapsed));
  }

  const phaseLabels = {
    idle: 'Ready to focus',
    running: 'Focusing',
    paused: 'Paused',
    break: 'Break',
    breakPaused: 'Break paused'
  };
  phaseEl.textContent = phaseLabels[timer.phase];

  if(timer.phase !== 'idle' && timer.label){
    const subjName = state.subjects.find(s => s.id === timer.subjectId);
    subEl.textContent = subjName ? `${timer.label} · ${subjName.name}` : timer.label;
  } else {
    subEl.textContent = '';
  }
}

function renderTimerActions(){
  const actions = document.getElementById('timerActions');
  actions.innerHTML = '';
  if(timer.phase === 'idle'){
    const b = document.createElement('button');
    b.className = 'btn-filled wide';
    b.textContent = 'Start';
    b.style.width = '100%';
    b.addEventListener('click', startSession);
    actions.appendChild(b);
  } else if(timer.phase === 'running' || timer.phase === 'break'){
    const pause = document.createElement('button');
    pause.className = 'btn-tonal';
    pause.textContent = 'Pause';
    pause.addEventListener('click', pauseSession);
    const stop = document.createElement('button');
    stop.className = 'btn-filled error';
    stop.textContent = 'Stop';
    stop.addEventListener('click', stopSession);
    actions.appendChild(pause);
    actions.appendChild(stop);
  } else if(timer.phase === 'paused' || timer.phase === 'breakPaused'){
    const resume = document.createElement('button');
    resume.className = 'btn-filled';
    resume.textContent = 'Resume';
    resume.addEventListener('click', resumeSession);
    const stop = document.createElement('button');
    stop.className = 'btn-filled error';
    stop.textContent = 'Stop';
    stop.addEventListener('click', stopSession);
    actions.appendChild(resume);
    actions.appendChild(stop);
  }
}

function renderStats(){
  const settings = getFocusSettings();
  const todayStr = new Date().toDateString();
  const todaySeconds = state.focus.sessions
    .filter(s => new Date(s.startedAt).toDateString() === todayStr)
    .reduce((sum, s) => sum + s.durationSeconds, 0);
  const goalSeconds = settings.dailyGoalMinutes * 60;
  const pct = goalSeconds === 0 ? 0 : Math.min(100, Math.round((todaySeconds/goalSeconds)*100));

  const goalH = Math.floor(settings.dailyGoalMinutes/60);
  const goalM = settings.dailyGoalMinutes % 60;
  const goalStr = goalM > 0 ? `${goalH}h ${goalM}m` : `${goalH}h`;

  document.getElementById('statsSummary').textContent = `${fmtDuration(todaySeconds)} of ${goalStr}`;
  document.getElementById('statsTrackFill').style.width = pct + '%';

  if(currentPage === 'focus'){
    document.getElementById('pctChip').textContent = pct + '%';
  }
}

function renderFocusPage(){
  populateSubjectSelect();
  document.getElementById('segPomodoro').classList.toggle('active', timer.mode==='pomodoro');
  document.getElementById('segStopwatch').classList.toggle('active', timer.mode==='stopwatch');
  document.getElementById('segPomodoro').disabled = timer.phase !== 'idle';
  document.getElementById('segStopwatch').disabled = timer.phase !== 'idle';

  const setupEl = document.getElementById('timerSetup');
  setupEl.classList.toggle('hidden', timer.phase !== 'idle');

  updateTimerDisplay();
  renderTimerActions();
  renderStats();
}

document.getElementById('segPomodoro').addEventListener('click', () => setMode('pomodoro'));
document.getElementById('segStopwatch').addEventListener('click', () => setMode('stopwatch'));

  updateTimerDisplay();
  renderStats();
  scheduleSave();
});

/* ---- History sheet ---- */
function renderHistory(){
  const body = document.getElementById('historyBody');
  const sessions = [...state.focus.sessions].sort((a,b) => new Date(b.startedAt) - new Date(a.startedAt));

  if(sessions.length === 0){
    body.innerHTML = '<div class="empty-note">No sessions logged yet. Start a timer on the Focus page to build your history.</div>';
    return;
  }

  let html = '';
  let lastDayLabel = null;
  const todayStr = new Date().toDateString();
  const yestStr = new Date(Date.now()-86400000).toDateString();

  sessions.forEach(s => {
    const d = new Date(s.startedAt);
    const dayStr = d.toDateString();
    let dayLabel = d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
    if(dayStr === todayStr) dayLabel = 'Today';
    else if(dayStr === yestStr) dayLabel = 'Yesterday';

    if(dayLabel !== lastDayLabel){
      html += `<div class="day-heading">${dayLabel}</div>`;
      lastDayLabel = dayLabel;
    }

    const timeStr = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
    const modeTag = s.mode === 'pomodoro' ? 'Pomodoro' : 'Stopwatch';
    const meta = s.subjectName ? `${s.subjectName} · ${modeTag} · ${timeStr}` : `${modeTag} · ${timeStr}`;

    html += `
      <div class="session-row" data-id="${s.id}">
        <div class="session-main">
          <p class="session-label">${escapeHtml(s.label)}</p>
          <div class="session-meta">${escapeHtml(meta)}</div>
        </div>
        <span class="session-dur">${fmtDuration(s.durationSeconds)}</span>
        <button class="icon-btn" aria-label="delete session" data-del="${s.id}">${TRASH_SVG}</button>
      </div>
    `;
  });

  body.innerHTML = html;

  body.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-del');
      const session = state.focus.sessions.find(s => s.id === id);
      openConfirmDialog(
        'Delete session?',
        `This will remove "${session ? session.label : 'this session'}" from your history. This can't be undone.`,
        () => {
          state.focus.sessions = state.focus.sessions.filter(s => s.id !== id);
          renderHistory();
          renderStats();
          scheduleSave();
        }
      );
    });
  });
}

document.getElementById('historyBtn').addEventListener('click', () => {
  renderHistory();
  document.getElementById('historyOverlay').classList.add('open');
});
document.getElementById('historyCloseBtn').addEventListener('click', () => {
  document.getElementById('historyOverlay').classList.remove('open');

document.getElementById('historyOverlay').addEventListener('click', (e) => {

});

/* ==================== Page navigation ==================== */
function showPage(page){
  currentPage = page;
  document.getElementById('page-home').classList.toggle('hidden', page !== 'home');
  document.getElementById('page-focus').classList.toggle('hidden', page !== 'focus');
  document.getElementById('navHome').classList.toggle('active', page === 'home');
  document.getElementById('navFocus').classList.toggle('active', page === 'focus');

  if(page === 'home'){
    document.getElementById('appbarEyebrow').textContent = 'Class 12 · Commerce';
    document.getElementById('appbarTitle').textContent = 'Syllabus Ledger';
    renderTotals();
  } else {
    document.getElementById('appbarEyebrow').textContent = 'Deep work';
    document.getElementById('appbarTitle').textContent = 'Focus';
    renderStats();
  }
}
document.getElementById('navHome').addEventListener('click', () => showPage('home'));
document.getElementById('navFocus').addEventListener('click', () => showPage('focus'));

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(e => console.error('SW failed', e));
  });
}

(async function init(){
  await loadState();
  renderSubjects();
  renderTotals();
  renderMilestones();
  renderFocusPage();
  showPage('home');
})();
